name: Run Tests on Pull Request

on:
  pull_request:
    branches: [ "main" ]

# Fork PRs run untrusted code in this job. Keep the token read-only so a
# malicious PR cannot use it to write to the repo.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Third-party actions are pinned to commit SHAs: a tag like v4 is
      # mutable, so a compromised tag would execute here on the next run.
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup PNPM
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test
